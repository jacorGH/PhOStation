<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoStation emulator</title>
<!-- Runs inside the main page. Swapping games replaces this whole frame, so the room stays connected. -->
<script src="js/boot.js"></script>
<script>
  // Emulator log: keep the emulator's own console messages (saved as they come in, so they
  // survive a crash) for the PSP check report. The previous run's log is kept as .prev.
  (function () {
    var KEY = 'phostation.emulog', log = [], timer = null;
    try { localStorage.setItem(KEY + '.prev', localStorage.getItem(KEY) || '[]'); localStorage.setItem(KEY, '[]'); } catch (e) {}
    var save = function () { try { localStorage.setItem(KEY, JSON.stringify(log.slice(-200))); } catch (e) {} };
    var text = function (a) { try { return typeof a === 'string' ? a : (a && a.message) || JSON.stringify(a); } catch (e) { return String(a); } };
    window.__emuLog = function (kind, args) {
      if (kind !== 'error' && /^Translation not found/.test(String(args && args[0]))) return; // menu noise
      log.push((new Date().toISOString().slice(11, 19) + ' ' + kind + ' ' + [].map.call(args, text).join(' ')).slice(0, 400));
      if (log.length > 300) log.splice(0, 100);
      // PSP video starting/ending (for auto-skip on iPhone)
      var last = log[log.length - 1];
      if (/sceMpegCreate|sceMpegInit\(/.test(last)) { try { parent.PS && parent.PS.emuVideo && parent.PS.emuVideo('start'); } catch (e) {} }
      else if (/sceMpegFinish|sceMpegDelete/.test(last)) { try { parent.PS && parent.PS.emuVideo && parent.PS.emuVideo('stop'); } catch (e) {} }
      // The emulator prints "Aborted(...)" when it stops for good (errors from the CDN's scripts
      // arrive here rather than as readable error events).
      if (!window.__fatal && /Aborted\(/.test(log[log.length - 1])) {
        window.__fatal = true;
        save();
        try { parent.PS && parent.PS.emuFatal && parent.PS.emuFatal(log[log.length - 1]); } catch (e) {}
      }
      if (kind === 'error' || kind === 'warn' || kind === 'beat') save(); // saved at once, so it survives a crash
      else if (!timer) timer = setTimeout(function () { timer = null; save(); }, 1500);
    };
    ['log', 'info', 'warn', 'error'].forEach(function (k) {
      var orig = console[k];
      console[k] = function () { window.__emuLog(k, arguments); return orig.apply(console, arguments); };
    });
  })();
  // Thread control: log every background thread (Web Worker) the emulator starts, and optionally make
  // the emulator (and its threads) believe the phone has fewer processor cores. The video decoder
  // starts one thread per reported core; capping it can avoid a burst of new threads at video start.
  (function () {
    var prefs = {};
    try { prefs = JSON.parse(localStorage.getItem('phostation.prefs') || '{}'); } catch (e) {}
    var cap = +prefs.pspThreads || 0;
    window.__workers = 0;
    window.__threadCap = cap;
    if (cap) { try { Object.defineProperty(navigator, 'hardwareConcurrency', { configurable: true, get: function () { return cap; } }); } catch (e) {} }
    var Orig = window.Worker;
    if (!Orig) return;
    function Wrapped(url, opts) {
      window.__workers++;
      try { window.__emuLog('beat', ['[phostation] emulator thread #' + window.__workers + ' started' + (opts && opts.name ? ' (' + opts.name + ')' : '')]); } catch (e) {}
      if (cap && !(opts && opts.type === 'module')) {
        // Same script, but with the core count capped inside the thread too.
        var abs = new URL(String(url), location.href).href;
        var src = 'try{Object.defineProperty(self.navigator,"hardwareConcurrency",{configurable:true,get:function(){return ' + cap + '}})}catch(e){}\nimportScripts(' + JSON.stringify(abs) + ');';
        return new Orig(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })), opts);
      }
      return new Orig(url, opts);
    }
    Wrapped.prototype = Orig.prototype;
    window.Worker = Wrapped;
  })();
  // Pass emulator errors up to the main page, so they can be shown instead of a silent blank screen.
  (function () {
    var report = function (msg) {
      try { window.__emuLog('error', [msg]); } catch (e) {}
      // "Aborted(...)" means the emulator stopped for good: tell the page so it can explain.
      if (/Aborted\(/.test(String(msg))) { try { parent.PS && parent.PS.emuFatal && parent.PS.emuFatal(String(msg)); } catch (e) {} return; }
      try { parent.PS && parent.PS.emuError && parent.PS.emuError(String(msg)); } catch (e) {}
    };
    addEventListener('error', function (e) { report(e.message || (e.target && e.target.src ? 'Couldn\u2019t load ' + e.target.src : 'Unknown error')); }, true);
    addEventListener('unhandledrejection', function (e) {
      var r = e.reason || {};
      // Safari refusing sound/fullscreen/wake-lock without a tap: harmless, keep it in the log only.
      if (r.name === 'NotAllowedError' || r.name === 'AbortError' || /permission|not allowed/i.test(r.message || '')) {
        try { window.__emuLog('warn', ['(blocked by browser) ' + (r.message || r.name)]); } catch (x) {}
        return;
      }
      report((r.message || e.reason) || 'Unknown error');
    });
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  .ejs_virtualGamepad_parent { display: none !important; }
  body:not(.ejs-ui) .ejs_menu_bar { display: none !important; }
  html[data-filter=sharp] canvas, html[data-filter=scan] canvas, html[data-filter=crt] canvas { image-rendering: pixelated; }
</style>
</head>
<body><div id="game"></div></body>
</html>
